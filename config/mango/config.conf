# MangoWC Configuration — Dynamic Island & scenefx Edition
# Docs: https://mangowm.github.io/

# =========================
# Window Effects (scenefx)
# =========================
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=6
blur_params_noise=0.02
blur_params_brightness=0.92
blur_params_contrast=0.95
blur_params_saturation=1.15

shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=14
shadows_blur=20
shadows_position_x=0
shadows_position_y=4

border_radius=20
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.98

dim_enable=0

# =========================
# Animations
# =========================
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.88
zoom_end_ratio=0.92
fade_in_begin_opacity=0.0
fade_out_begin_opacity=0.85
animation_duration_move=320
animation_duration_open=300
animation_duration_tag=280
animation_duration_close=260
animation_duration_focus=120
animation_curve_open=0.22,1.0,0.36,1.0
animation_curve_move=0.22,1.0,0.36,1.0
animation_curve_tag=0.22,1.0,0.36,1.0
animation_curve_close=0.4,0.0,0.2,1.0
animation_curve_focus=0.22,1.0,0.36,1.0
animation_curve_opacity_fade_out=0.4,0.0,0.2,1.0
animation_curve_opacity_fade_in=0.22,1.0,0.36,1.0

# =========================
# Layout Settings
# =========================
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0

dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0
monocle_no_radius=0
deck_tab_mode=1

# Overview Settings
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=6
overview_gap_outer=28
overcircle_center_ratio=0.5
title_message_bar_height=52
title_message_bar_gap=20

# =========================
# Misc & Behavior
# =========================
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=1
snap_distance=24
float_full_to_top=0
cursor_size=24
cursor_theme=catppuccin-mocha-dark-cursors
drag_tile_to_tile=1
drag_tile_small=1

# =========================
# Input (Keyboard / Trackpad / Mouse)
# =========================
repeat_rate=30
repeat_delay=450
numlock_on=0
xkb_rules_layout=us,ara
xkb_rules_options=grp:alt_shift_toggle

disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1
mouse_natural_scrolling=0

# =========================
# Gaps, Borders & Dynamic Theme
# =========================
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=10
gap_outer_vertical=8
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=0

# Dynamic colors managed by apply-theme.sh and Matugen
source=~/.config/mango/theme.conf

# Dynamic visual mode managed by apply-mode.sh (default | simple | blur)
source=~/.config/mango/mode.conf

# Optional per-device overrides (monitors, keyboard layout, trackpad, etc.)
source_optional=~/.config/mango/local.conf

# =========================
# Tag Rules (1-9)
# =========================
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# =========================
# Session Autostart
# =========================
exec_once=~/.config/mango/autostart.sh

# =========================
# Key Bindings
# =========================
bind=SUPER,r,reload_config

# Quickshell Dynamic Island & Settings Controls
bind=SUPER,a,spawn,qs ipc call island toggleLauncher
bind=SUPER,space,spawn,qs ipc call island toggleLauncher
bind=SUPER+SHIFT,t,spawn,qs ipc call island toggleThemeTab
bind=SUPER,d,spawn,qs ipc call island toggleDashboard
bind=SUPER,s,spawn,qs ipc call island toggleSettings
bind=SUPER+SHIFT,l,spawn_shell,$HOME/.config/quickshell/scripts/lock.sh

# Media & Brightness Keys -> Hardware Update + Dynamic Island OSD
bind=NONE,XF86AudioRaiseVolume,spawn_shell,pactl set-sink-volume @DEFAULT_SINK@ +5% && qs ipc call island showOsd volume
bind=NONE,XF86AudioLowerVolume,spawn_shell,pactl set-sink-volume @DEFAULT_SINK@ -5% && qs ipc call island showOsd volume
bind=NONE,XF86AudioMute,spawn_shell,pactl set-sink-mute @DEFAULT_SINK@ toggle && qs ipc call island showOsd mute
bind=NONE,XF86MonBrightnessUp,spawn_shell,brightnessctl set +5% && qs ipc call island showOsd brightness
bind=NONE,XF86MonBrightnessDown,spawn_shell,brightnessctl set 5%- && qs ipc call island showOsd brightness

# Core Apps & Screenshots
bind=SUPER,Return,spawn_shell,$HOME/.config/quickshell/scripts/launch-app.sh terminal
bind=SUPER,b,spawn_shell,$HOME/.config/quickshell/scripts/launch-app.sh browser
bind=SUPER,z,spawn_shell,$HOME/.config/quickshell/scripts/launch-app.sh editor
bind=SUPER,equal,spawn_shell,$HOME/.config/quickshell/scripts/screenshot.sh --area
bind=SUPER+SHIFT,equal,spawn_shell,$HOME/.config/quickshell/scripts/screenshot.sh --full

# Window Management
bind=SUPER,m,quit
bind=SUPER,q,killclient,

# Switch Window Focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Move Window
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right

# Window States
bind=SUPER,g,toggleglobal,
bind=SUPER+SHIFT,Tab,togglejump,
bind=SUPER,backslash,togglefloating,
bind=SUPER+SHIFT,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER+ALT,z,toggle_scratchpad

# Scroller, Dwindle & Tiling Layouts
bind=SUPER,t,spawn_shell,$HOME/.config/quickshell/scripts/force-tile.sh
bind=SUPER,e,set_proportion,1.0
bind=SUPER,x,switch_proportion_preset,
bind=SUPER+ALT+CTRL,Left,scroller_stack,left
bind=SUPER+ALT+CTRL,Right,scroller_stack,right
bind=SUPER+ALT+CTRL,Up,scroller_stack,up
bind=SUPER+ALT+CTRL,Down,scroller_stack,down
bind=SUPER+SHIFT,Return,dwindle_toggle_split_direction
bind=SUPER,n,switch_layout

# Tag Switch
bind=SUPER+CTRL,Left,viewtoleft,0
bind=SUPER+ALT,Left,viewtoleft_have_client,0
bind=SUPER+CTRL,Right,viewtoright,0
bind=SUPER+ALT,Right,viewtoright_have_client,0
bind=SUPER+CTRL+SHIFT,Left,tagtoleft,0
bind=SUPER+CTRL+SHIFT,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Monitor Switch
bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right
bind=SUPER+SHIFT,comma,tagmon,left
bind=SUPER+SHIFT,period,tagmon,right

# Gaps
bind=SUPER+SHIFT,X,incgaps,1
bind=SUPER+SHIFT,Z,incgaps,-1
bind=SUPER+ALT,r,togglegaps

# Move & Resize Floating Windows
bind=SUPER+CTRL,k,movewin,+0,-50
bind=SUPER+CTRL,j,movewin,+0,+50
bind=SUPER+CTRL,h,movewin,-50,+0
bind=SUPER+CTRL,l,movewin,+50,+0

bind=SUPER+ALT,k,resizewin,+0,-50
bind=SUPER+ALT,j,resizewin,+0,+50
bind=SUPER+ALT,h,resizewin,-50,+0
bind=SUPER+ALT,l,resizewin,+50,+0

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

# =========================
# Layer Rules
# =========================
# Prevent MangoWC from blurring/shadowing the transparent 540px PanelWindow region around the Dynamic Island and slurp overlay
layer_rule=no_blur:1,no_shadow:1,no_animation:1,layer_name:quickshell-island
layer_rule=no_blur:1,no_shadow:1,no_animation:1,layer_name:quickshell-simple-bar
layer_rule=no_blur:1,no_shadow:1,no_animation:1,layer_name:quickshell-settings
layer_rule=no_blur:1,no_shadow:1,no_animation:1,layer_name:selection
