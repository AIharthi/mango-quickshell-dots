[package]
name = "aurora-backend"
version = "2.1.0"
edition = "2021"
description = "Zero-dependency Rust system telemetry, probe, monitor, clipboard, calc, captures, distro, services, snippets, pip, workspaces, and doctor backend for Aurora Shell"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
